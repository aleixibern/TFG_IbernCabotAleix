

services:
  # 1. BASE DE DADES POSTGRESQL
  db:
    image: postgres:15-alpine
    container_name: tfg_db
    environment:
      POSTGRES_DB: tfg_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 97726969Grimya
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # 2. BACKEND SPRING BOOT
  backend:
    build: ./backend/backend
    container_name: tfg_backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/tfg_db
    depends_on:
      - db

  # 3. FRONTEND REACT (VITE)
  frontend:
    build: ./frontend
    container_name: tfg_frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data: